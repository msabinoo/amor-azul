<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020817">
<meta name="description" content="Uma surpresa feita com amor.">
<title>Per il mio amore 💙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Orbitron:wght@700;900&display=swap">
<style>
:root{color-scheme:dark;--bg:#020817;--night:#071b38;--deep:#103b70;--neon:#2563eb;--ice:#82cfff;--white:#eaf6ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}body{font-family:Georgia,'Times New Roman',serif;color:var(--white);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
main{position:relative;width:100%;height:100vh;height:100dvh;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#0b2856 0%,#05132c 34%,#020817 76%)}
main:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,transparent 18%,#020817b0 95%);pointer-events:none;z-index:1}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));transition:opacity 1.05s ease,visibility 1.05s ease;z-index:2}
.screen[aria-hidden="true"]{opacity:0;visibility:hidden;pointer-events:none}.screen[aria-hidden="false"]{opacity:1;visibility:visible}
.kicker{font-size:clamp(27px,8vw,48px);font-style:italic;letter-spacing:.02em;color:#e8f6ff;text-shadow:0 0 22px #2563eb95;text-align:center;margin:0 0 clamp(24px,7vh,58px);font-weight:normal}
.finger-wrap{--p:0;position:relative;width:min(62vw,270px);height:min(62vw,270px);min-width:190px;min-height:190px;display:grid;place-items:center;touch-action:none}
.halo{position:absolute;inset:0;border:1px solid #448dff70;border-radius:50%;box-shadow:0 0 21px #2563eb28,inset 0 0 20px #2563eb22;pointer-events:none}.halo.h2{inset:13px;border-style:dashed;opacity:.5}.halo.h3{inset:-12px;opacity:.35}
#fingerprint{position:relative;z-index:3;display:grid;place-items:center;border:0;cursor:pointer;background:none;width:85%;height:85%;padding:10%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline-offset:6px;filter:drop-shadow(0 0 calc(11px + var(--p) * 16px) #2563ebc4)}#fingerprint:disabled{opacity:1;cursor:default}#fingerprint:focus-visible{outline:2px solid var(--ice);border-radius:50%}#fingerprint svg{height:100%;width:100%;overflow:visible}#fingerprint path{fill:none;stroke:var(--ice);stroke-width:3.4;stroke-linecap:round;opacity:.88}
.prompt{margin:clamp(26px,6vh,52px) 0 0;min-height:46px;text-align:center;color:#b9dfff;font:500 clamp(14px,3.6vw,17px)/1.5 system-ui,sans-serif;letter-spacing:.06em;transition:opacity .3s}
.pct{margin:4px 0 0;min-height:18px;font:600 12px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.32em;padding-left:.32em;color:#82cfff;text-shadow:0 0 8px #2563eb;opacity:0;transition:opacity .5s}.engaged .pct{opacity:.85}

/* ===== Reconhecimento biométrico ===== */
#fingerprint .ridges path{opacity:calc(.6 + var(--p) * .4)}
#fingerprint .fp-light{opacity:0;transition:opacity .9s ease}
#fingerprint .fp-light path{stroke:#eaf8ff;stroke-width:3.6;stroke-dasharray:7 46;opacity:1;animation:ridge 1.3s linear infinite}
.engaged #fingerprint .fp-light{opacity:.22}.holding #fingerprint .fp-light,.done #fingerprint .fp-light{opacity:.95}
.fp-glow{position:absolute;inset:8%;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,#82cfff 0%,#3b82f6aa 35%,#2563eb40 65%,transparent 100%);opacity:calc(var(--p) * .55);transition:opacity .9s ease}
.holding .fp-glow{opacity:calc(.3 + var(--p) * .7);animation:glowPulse 1.1s ease-in-out infinite}
.prog{position:absolute;left:-16px;top:-16px;width:calc(100% + 32px);height:calc(100% + 32px);transform:rotate(-90deg);overflow:visible;pointer-events:none;filter:drop-shadow(0 0 5px #3b82f6) drop-shadow(0 0 12px #2563eb);transition:transform 1.3s cubic-bezier(.2,.8,.2,1),opacity 1.3s ease}
.prog-track{fill:none;stroke:#1d4ed8;stroke-width:3;opacity:.35}
.prog-ticks{fill:none;stroke:#82cfff;stroke-width:5;stroke-dasharray:1 5.1;opacity:.2;transition:opacity .9s}.holding .prog-ticks{opacity:.5}
.prog-bar{fill:none;stroke:#bfe6ff;stroke-width:4;stroke-linecap:round;stroke-dasharray:609.47;stroke-dashoffset:609.47;opacity:.7;transition:opacity .9s ease}.holding .prog-bar,.done .prog-bar{opacity:1}
.orbit{position:absolute;inset:-6px;pointer-events:none;opacity:0;transition:opacity .9s ease;animation:spin 3.4s linear infinite;animation-play-state:paused}
.orbit span{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#eaf8ff;box-shadow:0 0 8px #82cfff,0 0 16px #3b82f6}.orbit .sm{width:3px;height:3px;margin:-1.5px 0 0 -1.5px}
.holding .orbit,.done .orbit{opacity:1;animation-play-state:running}
.scanbox{position:absolute;inset:16%;z-index:4;pointer-events:none;opacity:0;transition:opacity .7s ease}
.scanbox i{position:absolute;left:-6%;right:-6%;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#eaf8ff,transparent);box-shadow:0 0 10px #82cfff,0 0 24px #3b82f6;animation:scanbar 1.5s ease-in-out infinite alternate}
.holding .scanbox{opacity:1}
.engaged .halo.h1{animation:scanRing 1.8s ease-out infinite}.engaged .halo.h2{animation:scanRing 1.8s ease-out .6s infinite}.engaged .halo.h3{animation:scanRing 1.8s ease-out 1.2s infinite}
.engaged:not(.holding):not(.done) .halo{animation-play-state:paused}
.done #fingerprint{animation:fpFlash 1.3s ease-out forwards}
.done .prog{transform:rotate(-90deg) scale(1.45);opacity:0}
.done .halo{animation:doneRing 1.2s ease-out forwards!important}
.done .fp-glow{opacity:1;animation:none;transform:scale(1.15);transition:opacity .3s,transform 1s ease}
.flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),#82cfff66,#2563eb33 35%,transparent 70%);opacity:0}
.shock{position:absolute;z-index:4;left:var(--fx,50%);top:var(--fy,50%);width:60vmax;height:60vmax;margin:-30vmax 0 0 -30vmax;border-radius:50%;border:2px solid #9fd8ff;box-shadow:0 0 30px #3b82f6,inset 0 0 30px #3b82f6;pointer-events:none;opacity:0;transform:scale(0)}
.done-wave .flash{animation:flashOut 1.4s ease-out forwards}.done-wave .shock{animation:shock 1.5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes scanRing{0%{transform:scale(.94);opacity:.7}100%{transform:scale(1.3);opacity:0}}
@keyframes ridge{to{stroke-dashoffset:-53}}
@keyframes scanbar{0%{top:0}100%{top:100%}}
@keyframes glowPulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
@keyframes fpFlash{0%{filter:drop-shadow(0 0 20px #82cfff) brightness(1)}20%{filter:drop-shadow(0 0 40px #eaf8ff) brightness(2.2)}100%{filter:drop-shadow(0 0 26px #82cfff) brightness(1.4)}}
@keyframes doneRing{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.3);opacity:0}}
@keyframes flashOut{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@keyframes shock{0%{transform:scale(.05);opacity:.95}100%{transform:scale(1.8);opacity:0}}

/* ===== Fase final: cenário cyber ===== */
#heartScreen{gap:0}
.nebula{position:absolute;inset:-12%;z-index:0;pointer-events:none;background:radial-gradient(38% 28% at 28% 30%,#1d4ed84d,transparent 70%),radial-gradient(42% 32% at 74% 70%,#2563eb40,transparent 72%),radial-gradient(55% 40% at 50% 50%,#0e3a8a80,transparent 75%),radial-gradient(28% 20% at 80% 18%,#38bdf824,transparent 70%);animation:nebula 26s ease-in-out infinite alternate;will-change:transform}
.floor{position:absolute;left:-40%;right:-40%;bottom:-4%;height:42%;z-index:0;pointer-events:none;perspective:340px;-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 92%);mask-image:linear-gradient(to top,#000 5%,transparent 92%);opacity:.55}
.plane{position:absolute;inset:0;transform:rotateX(66deg);transform-origin:50% 100%;overflow:hidden;transform-style:preserve-3d}
.plane i{position:absolute;left:0;right:0;top:-46px;bottom:0;background-image:linear-gradient(#3b82f680 1px,transparent 1px),linear-gradient(90deg,#3b82f680 1px,transparent 1px);background-size:46px 46px;animation:gridRun 1.6s linear infinite;will-change:transform}
#matrix{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scanlines{position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,#82cfff0a 0 1px,transparent 1px 3px)}
.beam{position:absolute;left:0;right:0;top:0;height:2px;z-index:1;pointer-events:none;background:linear-gradient(90deg,transparent,#82cfff,#eaf8ff,#82cfff,transparent);box-shadow:0 0 12px #3b82f6,0 0 30px #2563eb;opacity:0;animation:beam 7.5s ease-in-out 3s infinite;will-change:transform,opacity}
.heart-content{position:relative;z-index:2;display:flex;align-items:center;flex-direction:column;justify-content:center;width:100%;gap:clamp(22px,5.5vh,46px)}

/* ===== TI AMO ===== */
.love{position:relative;margin:0;padding-left:.2em;white-space:nowrap;text-align:center;font:900 clamp(40px,13.5vw,104px)/1.08 Orbitron,'Avenir Next',system-ui,sans-serif;letter-spacing:.2em;color:#eef9ff;text-shadow:0 0 4px #bfe6ff,0 0 14px #3b8bff,0 0 34px #2563eb,0 0 72px #1d4ed8}
.love .ch{display:inline-block;text-align:center;opacity:0;transform:translateY(.3em);filter:blur(6px);transition:opacity .5s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .6s ease;transition-delay:calc(var(--i) * 70ms)}
.show-love .love .ch{opacity:1;transform:none;filter:blur(0)}
.ch.scr{color:#5aa8ff;text-shadow:0 0 8px #2563eb}
.ch.lock{animation:lock .8s ease-out}
.love:before,.love:after{content:attr(data-text);position:absolute;inset:0;padding-left:.2em;pointer-events:none;opacity:0;text-shadow:none;-webkit-clip-path:inset(100% 0 0 0);clip-path:inset(100% 0 0 0)}
.love:before{color:#82cfff;transform:translateX(-.06em)}.love:after{color:#2f6dff;transform:translateX(.06em)}
.glitch .love:before{opacity:.85;animation:glitchA 5.2s steps(1) infinite}.glitch .love:after{opacity:.85;animation:glitchB 5.2s steps(1) infinite}
.glitch .love{animation:jolt 5.2s steps(1) infinite}
.bar{position:absolute;left:16%;right:16%;bottom:-.32em;height:1px;background:linear-gradient(90deg,transparent,#82cfff 20%,#82cfff 80%,transparent);box-shadow:0 0 8px #3b82f6;transform:scaleX(0);opacity:0;transition:transform 1.6s cubic-bezier(.2,.8,.2,1) .9s,opacity .8s ease .9s}
.bar:before,.bar:after{content:"";position:absolute;top:-3px;width:1px;height:7px;background:#82cfff;box-shadow:0 0 6px #82cfff}.bar:before{left:12%}.bar:after{right:12%}
.bar i{position:absolute;top:-2px;left:0;width:18%;height:5px;border-radius:5px;background:radial-gradient(closest-side,#fff,#82cfff 45%,transparent);animation:barRun 2.8s ease-in-out infinite}
.show-love .bar{transform:scaleX(1);opacity:.9}

/* ===== Coração cyber ===== */
.heart-shell{--hs:min(76vw,360px,42vh);position:relative;width:var(--hs);height:calc(var(--hs) / 1.05);opacity:0;transform:scale(.8);transition:opacity 1.4s ease,transform 1.9s cubic-bezier(.2,.8,.2,1)}
.show-heart .heart-shell{opacity:1;transform:none}
.rays{position:absolute;inset:-70%;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 50%,#82cfff17 0deg 1.4deg,transparent 1.4deg 9deg);-webkit-mask-image:radial-gradient(closest-side,#000 12%,transparent 100%);mask-image:radial-gradient(closest-side,#000 12%,transparent 100%);opacity:0;transition:opacity 3s ease .8s;animation:spin 140s linear infinite}
.show-heart .rays{opacity:.8}
.hud{position:absolute;left:50%;top:50%;width:calc(var(--hs) * 1.22);height:calc(var(--hs) * 1.22);margin:calc(var(--hs) * -.61) 0 0 calc(var(--hs) * -.61);pointer-events:none;opacity:0;transform:scale(.8);transition:opacity 2s ease 1s,transform 2.4s cubic-bezier(.2,.8,.2,1) 1s}
.show-heart .hud{opacity:1;transform:none}
.hud svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hud-a{animation:spin 60s linear infinite}.hud-b{animation:spin 90s linear infinite reverse}
.h-ticks{fill:none;stroke:#82cfff;stroke-width:6;stroke-dasharray:1 9;opacity:.26}
.h-arc{fill:none;stroke:#3b82f6;stroke-width:1.6;stroke-dasharray:120 40 20 40 6 40;opacity:.75}
.h-dots{fill:none;stroke:#eaf8ff;stroke-width:1;stroke-dasharray:2 14;opacity:.35}
.h-brk{fill:none;stroke:#82cfff;stroke-width:2;opacity:.65}
.aura{position:absolute;inset:-38%;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,#3b82f6a6,#2563eb52 38%,#1d4ed824 62%,transparent 100%);opacity:.7;will-change:transform,opacity}
.heart-beat{position:absolute;inset:0;z-index:2;transform-origin:50% 52%}
.heart-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.heart-glow{opacity:.85;will-change:opacity}
.heart-svg .bloom{fill:none;stroke:#2f6dff;stroke-width:15}
.heart-svg .inner{opacity:0;transition:opacity 1.8s ease .5s}.show-heart .heart-svg .inner{opacity:1}
.heart-svg .rim1{fill:none;stroke:#2563eb;stroke-width:34;opacity:.32}
.heart-svg .rim2{fill:none;stroke:#82cfff;stroke-width:8;opacity:.28}
.heart-svg .gridtex{opacity:.3}
.heart-svg .blobs{transform-origin:160px 150px;animation:spin 18s linear infinite}
.heart-svg .b1{animation:float1 7s ease-in-out infinite alternate}.heart-svg .b2{animation:float2 9s ease-in-out infinite alternate}.heart-svg .b3{animation:float1 11s ease-in-out -4s infinite alternate-reverse}
.heart-svg .core{transform-origin:160px 145px;opacity:.75}
.heart-svg .sigil{fill:none;stroke:#82cfff;stroke-width:1;stroke-dasharray:2 9;opacity:.45;animation:flow1 14s linear infinite}
.heart-svg .trace{fill:none;stroke:#3b82f6;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.heart-svg .pulse{fill:none;stroke:#eaf8ff;stroke-width:2;stroke-linecap:round;stroke-dasharray:10 300;stroke-dashoffset:10;animation:trace 2.8s linear infinite}
.heart-svg .node{fill:#82cfff;animation:twinkle 2.8s ease-in-out infinite}
.heart-svg .scanband{animation:scanY 3.6s linear infinite}
.heart-svg .motes circle{fill:#eaf8ff;animation:twinkle 3.2s ease-in-out infinite}
.heart-svg .ring{fill:none;stroke:#82cfff;stroke-width:1;stroke-dasharray:1 7;opacity:0;transition:opacity 2s ease 1.2s;animation:flow3 30s linear infinite}.show-heart .heart-svg .ring{opacity:.55}
.heart-svg .outline{fill:none;stroke:#9fd8ff;stroke-width:.9;stroke-dasharray:860;stroke-dashoffset:-860;opacity:.8;transition:stroke-dashoffset 2.4s cubic-bezier(.55,.1,.25,1) .3s}.show-heart .heart-svg .outline{stroke-dashoffset:0}
.heart-svg .echo{transform-origin:160px 150px;opacity:0}.heart-svg .echo use{fill:none;stroke:#82cfff;stroke-width:2}
.heart-svg .neon{fill:none;stroke:#3d8bff;stroke-width:9;opacity:.5}
.heart-svg .main{fill:none;stroke-width:4.6;stroke-linejoin:round}
.heart-svg .hot{fill:none;stroke:#f2fbff;stroke-width:1.3;opacity:.9}
.heart-svg .draw{stroke-dasharray:820;stroke-dashoffset:820;transition:stroke-dashoffset 2.1s cubic-bezier(.55,.1,.25,1)}.show-heart .heart-svg .draw{stroke-dashoffset:0}
.heart-svg .runner{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:60 760;opacity:0;transition:opacity 1.2s ease}
.heart-svg .runner.glow{stroke:#82cfff;stroke-width:10}
.show-words .heart-svg .runner{opacity:.9;animation:run 3.6s linear infinite}.show-words .heart-svg .runner.glow{opacity:.35}.show-words .heart-svg .late{animation-delay:-1.8s}
.sparks{position:absolute;left:-30%;top:-30%;width:160%;height:160%;z-index:3;pointer-events:none}
.heart-shell.pulsing .heart-beat{animation:beat 1.6s ease-in-out infinite;will-change:transform}
.heart-shell.pulsing .aura{animation:auraBeat 1.6s ease-in-out infinite}
.heart-shell.pulsing .core{animation:coreBeat 1.6s ease-in-out infinite}
.heart-shell.pulsing .heart-glow,.heart-shell.pulsing .neon{animation:glowBeat 1.6s ease-in-out infinite}
.heart-shell.pulsing .echo{animation:echo 1.6s ease-out infinite}.heart-shell.pulsing .echo.e2{animation-delay:.28s}

/* ===== SONO TUA ===== */
.heart-copy{position:absolute;left:0;right:0;top:49%;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.sono{font:700 calc(var(--hs) * .15)/1 Cinzel,'Trajan Pro',Georgia,serif;letter-spacing:.16em;padding-left:.16em;white-space:nowrap;color:#f2fbff;text-shadow:0 0 3px #d6f0ff,0 0 12px #5aa8ff,0 0 28px #2563eb,0 0 48px #1d4ed8}
.sono .ch{display:inline-block;text-align:center;opacity:0;filter:blur(8px);transform:scale(1.3);transition:opacity .7s ease,filter .9s ease,transform 1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i) * 90ms)}
.show-words .sono .ch{opacity:1;filter:blur(0);transform:none}
.sep{display:flex;align-items:center;gap:7px;width:calc(var(--hs) * .5);height:calc(var(--hs) * .075);opacity:0;transform:scaleX(0);transition:transform 1.2s cubic-bezier(.2,.8,.2,1) .6s,opacity .8s ease .6s}
.sep i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#82cfff);box-shadow:0 0 6px #3b82f6}.sep i:last-child{background:linear-gradient(90deg,#82cfff,transparent)}
.sep b{width:6px;height:6px;transform:rotate(45deg);background:#eaf8ff;box-shadow:0 0 6px #fff,0 0 14px #82cfff,0 0 24px #2563eb}
.show-words .sep{opacity:1;transform:none}
.heart-shell.pulsing .sono{animation:textBeat 1.6s ease-in-out 2.4s infinite}

@keyframes nebula{0%{transform:translate3d(-2%,-1%,0) scale(1)}100%{transform:translate3d(2%,1.5%,0) scale(1.08)}}
@keyframes gridRun{to{transform:translateY(46px)}}
@keyframes beam{0%{transform:translateY(-10px);opacity:0}6%{opacity:.6}48%{transform:translateY(100vh);opacity:.35}49%,100%{transform:translateY(100vh);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lock{0%{color:#fff;text-shadow:0 0 6px #fff,0 0 22px #82cfff,0 0 48px #3b82f6}}
@keyframes barRun{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(455%);opacity:0}}
@keyframes glitchA{0%{-webkit-clip-path:inset(100% 0 0 0);clip-path:inset(100% 0 0 0)}90%{-webkit-clip-path:inset(12% 0 68% 0);clip-path:inset(12% 0 68% 0)}92%{-webkit-clip-path:inset(58% 0 22% 0);clip-path:inset(58% 0 22% 0)}94%{-webkit-clip-path:inset(34% 0 48% 0);clip-path:inset(34% 0 48% 0)}96%,100%{-webkit-clip-path:inset(100% 0 0 0);clip-path:inset(100% 0 0 0)}}
@keyframes glitchB{0%{-webkit-clip-path:inset(100% 0 0 0);clip-path:inset(100% 0 0 0)}90%{-webkit-clip-path:inset(70% 0 8% 0);clip-path:inset(70% 0 8% 0)}92%{-webkit-clip-path:inset(20% 0 62% 0);clip-path:inset(20% 0 62% 0)}94%{-webkit-clip-path:inset(46% 0 30% 0);clip-path:inset(46% 0 30% 0)}96%,100%{-webkit-clip-path:inset(100% 0 0 0);clip-path:inset(100% 0 0 0)}}
@keyframes jolt{0%,100%{transform:none}91%{transform:translateX(2px)}93%{transform:translateX(-2px)}95%{transform:none}}
@keyframes float1{0%{transform:translate(-14px,8px)}100%{transform:translate(16px,-10px)}}
@keyframes float2{0%{transform:translate(12px,12px)}100%{transform:translate(-16px,-8px)}}
@keyframes flow1{to{stroke-dashoffset:-220}}
@keyframes flow3{to{stroke-dashoffset:-240}}
@keyframes trace{to{stroke-dashoffset:-300}}
@keyframes scanY{0%{transform:translateY(0)}100%{transform:translateY(340px)}}
@keyframes run{to{stroke-dashoffset:-820}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.95}}
@keyframes beat{0%{transform:scale(1)}12%{transform:scale(1.075)}22%{transform:scale(.995)}34%{transform:scale(1.05)}55%,100%{transform:scale(1)}}
@keyframes auraBeat{0%{transform:scale(.92);opacity:.6}12%{transform:scale(1.08);opacity:1}22%{transform:scale(.98);opacity:.75}34%{transform:scale(1.04);opacity:.95}60%,100%{transform:scale(.92);opacity:.6}}
@keyframes coreBeat{0%{transform:scale(.94);opacity:.6}12%{transform:scale(1.1);opacity:1}24%{transform:scale(.98);opacity:.72}34%{transform:scale(1.05);opacity:.92}60%,100%{transform:scale(.94);opacity:.6}}
@keyframes glowBeat{0%{opacity:.5}12%{opacity:1}24%{opacity:.68}34%{opacity:.92}60%,100%{opacity:.5}}
@keyframes echo{0%{transform:scale(1);opacity:0}6%{opacity:.75}70%{transform:scale(1.32);opacity:0}100%{transform:scale(1.32);opacity:0}}
@keyframes textBeat{0%,60%,100%{text-shadow:0 0 3px #d6f0ff,0 0 12px #5aa8ff,0 0 28px #2563eb,0 0 48px #1d4ed8}12%{text-shadow:0 0 4px #fff,0 0 16px #82cfff,0 0 36px #3b82f6,0 0 62px #2563eb}}

.stars{position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(#82cfff88 1px,transparent 1.5px),radial-gradient(#2563eb55 1px,transparent 1.5px);background-position:18px 30px,70px 90px;background-size:125px 145px,210px 180px;opacity:.4}

</style>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const finger=$('fingerprint');
const scan=$('scanScreen');
const heart=$('heartScreen');
const status=$('status');
const content=$('heartContent');
const shell=$('heartShell');
const love=$('love');
const copy=$('heartCopy');
const canvas=$('matrix');
const ctx=canvas.getContext('2d');
const sparks=$('sparks');
const sctx=sparks.getContext('2d');
const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const BEAT=reduce?3500:1600;
let started=false,phase='waiting',frame=0,running=false,lastT=0,W=0,H=0,columns=[],zones=[];
let sparksOn=false,beatStart=0,lastBeat=-1,secondDone=false,particles=[],ripples=[],SW=0,SH=0,S=0,contour=[],center={x:0,y:0};
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
/* ---------- reconhecimento: pressionar e segurar ---------- */
const app=$('app');
const wrap=$('fingerWrap');
const progBar=$('progBar');
const pct=$('pct');
const HOLD_MS=4000,RING=609.47;
const MSGS=[[.2,'Reconhecendo seu toque...'],[.45,'Carregando...'],[.7,'Quase...'],[Infinity,'Só mais um pouquinho...']];
let progress=0,holding=false,holdPointer=null,holdRaf=0,holdLast=0,completed=false,fontsAsked=false;
(()=>{const ridges=finger.querySelector('.ridges');if(!ridges)return;const light=ridges.cloneNode(true);light.setAttribute('class','fp-light');ridges.parentNode.appendChild(light)})();
function renderProgress(){
 wrap.style.setProperty('--p',progress.toFixed(3));
 progBar.style.strokeDashoffset=(RING*(1-progress)).toFixed(2);
 pct.textContent=Math.floor(progress*100)+'%';
 const msg=MSGS.find(m=>progress<m[0])[1];if(status.textContent!==msg)status.textContent=msg;
}
function holdLoop(t){
 holdRaf=0;if(!holding||completed)return;
 const dt=holdLast?Math.min(64,t-holdLast):0;holdLast=t;
 progress=Math.min(1,progress+dt/HOLD_MS);renderProgress();
 if(progress>=1){complete();return}
 holdRaf=requestAnimationFrame(holdLoop);
}
function press(){
 if(completed||holding)return;holding=true;holdLast=0;
 if(!fontsAsked&&document.fonts&&document.fonts.load){fontsAsked=true;document.fonts.load('900 48px Orbitron').catch(()=>{});document.fonts.load('700 48px Cinzel').catch(()=>{})}
 scan.classList.add('engaged','holding');renderProgress();
 if(!holdRaf)holdRaf=requestAnimationFrame(holdLoop);
}
function release(){
 holdPointer=null;if(!holding)return;holding=false;scan.classList.remove('holding');
 if(holdRaf){cancelAnimationFrame(holdRaf);holdRaf=0}
}
function complete(){
 if(completed)return;completed=true;holding=false;holdPointer=null;progress=1;renderProgress();
 status.textContent='Amor reconhecido 💙';pct.textContent='100%';
 const r=finger.getBoundingClientRect(),a=app.getBoundingClientRect();
 app.style.setProperty('--fx',(r.left-a.left+r.width/2)+'px');app.style.setProperty('--fy',(r.top-a.top+r.height/2)+'px');
 scan.classList.remove('holding');scan.classList.add('done');app.classList.add('done-wave');
 finger.blur();begin();
}
finger.addEventListener('pointerdown',e=>{
 if(completed||holdPointer!==null)return;if(e.pointerType==='mouse'&&e.button!==0)return;
 e.preventDefault();holdPointer=e.pointerId;try{finger.setPointerCapture(e.pointerId)}catch(_){}press();
});
const endPointer=e=>{if(e.pointerId===holdPointer)release()};
['pointerup','pointercancel','lostpointercapture'].forEach(n=>finger.addEventListener(n,endPointer));
finger.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
finger.addEventListener('contextmenu',e=>e.preventDefault());
finger.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat&&holdPointer===null&&!completed){e.preventDefault();holdPointer='key';press()}});
finger.addEventListener('keyup',e=>{if((e.key===' '||e.key==='Enter')&&holdPointer==='key')release()});
finger.addEventListener('blur',()=>{if(holdPointer==='key')release()});
window.addEventListener('blur',release);
document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});

async function begin(){
 if(started)return;started=true;phase='scanning';
 await sleep(1500);
 finger.disabled=true;phase='transitioning';heart.setAttribute('aria-hidden','false');scan.setAttribute('aria-hidden','true');
 startRain();await sleep(1050);
 phase='heart';content.classList.add('show-love');decode(love,380,120);await sleep(1300);content.classList.add('show-heart');await sleep(1900);
 content.classList.add('show-words');decode(copy,250,110);shell.classList.add('pulsing');measure();beatStart=performance.now();lastBeat=-1;sparksOn=true;
 await sleep(1600);content.classList.add('glitch');
}

/* ---------- letras que se decodificam ---------- */
const SCRAMBLE=Array.from('01ABCDEF#$%&<>/ΞΔΛアイウカキ');
function decode(el,base,per){
 const chars=Array.from(el.querySelectorAll('.ch'));if(!chars.length)return;
 chars.forEach(c=>{c.style.width=c.offsetWidth+'px';c.classList.add('scr')});
 const t0=performance.now();
 const id=setInterval(()=>{const now=performance.now()-t0;let done=0;
  chars.forEach((c,i)=>{if(c.classList.contains('lock')){done++;return}
   if(now>=base+i*per){c.textContent=c.dataset.c;c.classList.remove('scr');c.classList.add('lock');done++}
   else c.textContent=SCRAMBLE[(Math.random()*SCRAMBLE.length)|0]});
  if(done===chars.length){clearInterval(id);setTimeout(()=>chars.forEach(c=>{c.style.width=''}),900)}},55);
}

/* ---------- chuva de códigos em 3 camadas de profundidade ---------- */
const GLYPHS=Array.from('01アイウエオカキクケコサシスセソタチツテトナニヌネノ01ABCDEF0110ΞΔΛΣΩ∞♡<>{}[]/+*=#$%');
const LAYERS=[
 {min:12,max:14,gap:10,alpha:.36,step:[80,130],body:'#1c4a96',head:'#6fb2ff',glow:0},
 {min:16,max:19,gap:20,alpha:.66,step:[55,95],body:'#2763d6',head:'#bfe4ff',glow:0},
 {min:21,max:26,gap:46,alpha:.95,step:[40,70],body:'#3b86ff',head:'#f0faff',glow:14}
];
const glyph=()=>GLYPHS[(Math.random()*GLYPHS.length)|0];
function buildColumns(){columns=[];LAYERS.forEach((L,li)=>{const n=Math.max(4,Math.round(W/L.gap));for(let i=0;i<n;i++)columns.push({li,x:Math.round((i+Math.random()*.8)*W/n),y:rnd(-H,H*.6),py:0,s:Math.round(rnd(L.min,L.max)),step:rnd(L.step[0],L.step[1]),next:0,prev:null})})}
function resize(){if(!ctx)return;const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;const rebuild=!columns.length||Math.abs(r.width-W)>40;W=r.width;H=r.height;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.textBaseline='top';if(rebuild)buildColumns();measure()}
function protect(x,y){let f=1;for(const z of zones){const dx=(x-z.x)/z.rx,dy=(y-z.y)/z.ry,d=dx*dx+dy*dy;if(d<1)f*=z.min+(1-z.min)*d*d}return f}
function drawRain(t,dt){
 ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,'+(1-Math.pow(.97,dt/16.7)).toFixed(4)+')';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
 let font='';
 for(const c of columns){
  if(t<c.next)continue;c.next=t+c.step;const L=LAYERS[c.li];const f=c.s+'px Menlo,"SF Mono",monospace';if(f!==font){ctx.font=f;font=f}
  if(c.prev!==null){ctx.clearRect(c.x-1,c.py-1,c.s+2,c.s+2);ctx.globalAlpha=L.alpha*protect(c.x,c.py)*rnd(.4,1);ctx.fillStyle=L.body;ctx.fillText(c.prev,c.x,c.py)}
  const g=glyph();c.prev=g;c.py=c.y;
  const flash=Math.random()<.04,glow=flash?12:L.glow;
  ctx.globalAlpha=Math.min(1,(flash?1:L.alpha*1.15))*protect(c.x,c.y);ctx.fillStyle=flash?'#eaf8ff':L.head;
  if(glow){ctx.shadowColor='#3d8bff';ctx.shadowBlur=glow}
  ctx.fillText(g,c.x,c.y);if(glow)ctx.shadowBlur=0;
  c.y+=c.s*1.05;
  if(c.y>H+c.s){c.y=-rnd(c.s,H*.5);c.prev=null;c.x=Math.round(Math.random()*W);c.step=rnd(L.step[0],L.step[1])}
 }
 ctx.globalAlpha=1;
}

/* ---------- faíscas, fragmentos e ondas de sinal ---------- */
const heartPts=(()=>{const pts=[];try{const p=$('hp'),len=p.getTotalLength();for(let i=0;i<160;i++){const q=p.getPointAtLength(len*i/160);pts.push({x:q.x,y:q.y})}}catch(e){}
 if(pts.length<10){pts.length=0;for(let i=0;i<160;i++){const a=i/160*Math.PI*2;pts.push({x:160+130*Math.pow(Math.sin(a),3),y:150-8.1*(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))})}}return pts})();
const sprite=document.createElement('canvas');sprite.width=sprite.height=64;
(()=>{const g=sprite.getContext('2d');if(!g)return;const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(240,250,255,1)');gr.addColorStop(.18,'rgba(160,215,255,.85)');gr.addColorStop(.45,'rgba(59,130,246,.3)');gr.addColorStop(1,'rgba(29,78,216,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)})();
function measure(){
 const cr=canvas.getBoundingClientRect(),hr=shell.getBoundingClientRect(),lr=love.getBoundingClientRect();zones=[];
 if(hr.width)zones.push({x:hr.left-cr.left+hr.width/2,y:hr.top-cr.top+hr.height*.48,rx:hr.width*.64,ry:hr.height*.64,min:.07});
 if(lr.width)zones.push({x:lr.left-cr.left+lr.width/2,y:lr.top-cr.top+lr.height/2,rx:lr.width*.62,ry:lr.height*1.15,min:.1});
 S=shell.offsetWidth;const Hs=shell.offsetHeight;if(!S||!sctx)return;
 SW=S*1.6;SH=Hs*1.6;const d=Math.min(window.devicePixelRatio||1,2);sparks.width=Math.round(SW*d);sparks.height=Math.round(SH*d);sctx.setTransform(d,0,0,d,0,0);
 const k=Math.min(S/320,Hs/300),ox=S*.3+(S-320*k)/2,oy=Hs*.3+(Hs-300*k)/2;
 contour=heartPts.map(p=>({x:ox+p.x*k,y:oy+p.y*k}));center={x:ox+160*k,y:oy+150*k};
}
function emit(n,force){for(let i=0;i<n&&particles.length<170;i++){const p=contour[(Math.random()*contour.length)|0];if(!p)return;let nx=p.x-center.x,ny=p.y-center.y;const m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;const sp=rnd(.012,.04)*force,r=Math.random();
 particles.push({x:p.x+rnd(-3,3),y:p.y+rnd(-3,3),vx:nx*sp+rnd(-.008,.008),vy:ny*sp-rnd(0,.012),life:0,max:rnd(900,2000),r:rnd(1,2.6),type:r<.22?1:r<.42?2:r<.58?3:0,tw:rnd(0,6.28)})}}
function drawSparks(t,dt){
 if(!sctx)return;sctx.clearRect(0,0,SW,SH);if(!sparksOn||!contour.length)return;
 const ph=t-beatStart,bi=Math.floor(ph/BEAT),within=ph-bi*BEAT;
 if(bi!==lastBeat){lastBeat=bi;secondDone=false;emit(reduce?4:16,2.2);ripples.push({life:0})}
 if(!secondDone&&within>BEAT*.3){secondDone=true;emit(reduce?2:8,1.5);if(!reduce)ripples.push({life:0,soft:true})}
 if(Math.random()<dt*.007)emit(1,1);
 sctx.globalCompositeOperation='lighter';
 for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.life+=dt;const k=r.life/1200;if(k>=1){ripples.splice(i,1);continue}
  sctx.globalAlpha=(1-k)*(r.soft?.3:.55);sctx.strokeStyle='#82cfff';sctx.lineWidth=(r.soft?1:1.8)*(1-k)+.3;sctx.beginPath();sctx.arc(center.x,center.y,S*(.42+.36*k),0,Math.PI*2);sctx.stroke()}
 sctx.strokeStyle='#e1f5ff';sctx.fillStyle='#d6f0ff';
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life+=dt;if(p.life>=p.max){particles.splice(i,1);continue}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=.000012*dt;p.vx*=.995;p.vy*=.995;
  const k=p.life/p.max,a=Math.max(0,(k<.15?k/.15:1-(k-.15)/.85)*(.65+.35*Math.sin(p.tw+p.life*.012)));
  sctx.globalAlpha=a;
  if(p.type===2){const s=p.r*1.6;sctx.fillRect(p.x-s/2,p.y-s/2,s,s);continue}
  if(p.type===3){const l=p.r*5,m=Math.hypot(p.vx,p.vy)||1;sctx.lineWidth=1;sctx.beginPath();sctx.moveTo(p.x,p.y);sctx.lineTo(p.x-p.vx/m*l,p.y-p.vy/m*l);sctx.stroke();continue}
  const s=p.r*7;sctx.drawImage(sprite,p.x-s/2,p.y-s/2,s,s);
  if(p.type===1){const l=p.r*5*(.6+.4*a);sctx.lineWidth=.8;sctx.beginPath();sctx.moveTo(p.x-l,p.y);sctx.lineTo(p.x+l,p.y);sctx.moveTo(p.x,p.y-l);sctx.lineTo(p.x,p.y+l);sctx.stroke()}}
 sctx.globalAlpha=1;sctx.globalCompositeOperation='source-over';
}

/* ---------- laço de animação ---------- */
function tick(t){if(!running)return;frame=requestAnimationFrame(tick);const dt=Math.min(50,lastT?t-lastT:16.7);lastT=t;drawRain(t,dt);drawSparks(t,dt)}
let resizeQueued=false;
function queueResize(){if(resizeQueued)return;resizeQueued=true;requestAnimationFrame(()=>{resizeQueued=false;if(phase==='transitioning'||phase==='heart')resize()})}
function startRain(){if(!ctx)return;resize();if(document.hidden)return;running=true;lastT=0;cancelAnimationFrame(frame);frame=requestAnimationFrame(tick)}
function stopRain(){running=false;cancelAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopRain();else if(phase==='transitioning'||phase==='heart')startRain()});
window.addEventListener('resize',queueResize,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(queueResize,250),{passive:true});
window.addEventListener('pageshow',e=>{if(e.persisted&&(phase==='transitioning'||phase==='heart'))startRain()});
})();
</script>
